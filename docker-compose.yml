services:
  web:
    container_name: itsm-muraai-tst
    image: node:18
    working_dir: /usr/src/app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    # Production deployment: build once, then serve. Avoids `ng watch` overhead
    # and ships the optimized/minified Angular bundle to clients.
    command: sh -c "npm install --legacy-peer-deps && npm run build:prod && npm start"
    restart: unless-stopped