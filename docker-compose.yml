services:
  web:
    container_name: itsm-muraai-tst
    build: .
    working_dir: /usr/src/app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - ENABLE_ALERT_JOBS=false
      - ENABLE_ZOHO_OUTBOUND=true
      - ADMIN_EMAIL_ALLOWLIST=ravi.chadaram@muraai.com,senthil.n@muraai.com,t.balaji@muraai.com,akash.yadav@muraai.com,automation.cloudops@muraai.com
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    # Production deployment: build once, then serve. Avoids `ng watch` overhead
    # and ships the optimized/minified Angular bundle to clients.
    command: sh -c "npm install --include=dev --legacy-peer-deps && npm run build:prod && npm start"
    restart: unless-stopped 
    